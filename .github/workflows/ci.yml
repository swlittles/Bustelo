name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        variant: [development, production]
    env:
      BUSTELO_BUILD_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test behavior
        run: bash scripts/test.sh
      - name: Build universal app
        env:
          BUSTELO_UNIVERSAL: '1'
        run: bash scripts/build.sh
      - name: Verify bundle
        run: |
          if [ "$BUSTELO_BUILD_VARIANT" = development ]; then
            app="dist/Bustelo Dev.app"; bundle=io.github.swlittles.Bustelo.dev
          else
            app="dist/Bustelo.app"; bundle=io.github.swlittles.Bustelo
          fi
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          test "$("$app/Contents/MacOS/$executable" --version)" = "$(cat VERSION)"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = "$bundle"
      - name: Verify installer packaging
        if: matrix.variant == 'production'
        run: bash scripts/release.sh preview
